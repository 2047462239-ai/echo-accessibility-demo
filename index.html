find('access-link').innerHTML=icon('sliders')+'无障碍设置';
find('big').onclick=()=>{state.big=!state.big;applySettings();saveSettings();};
find('contrast').onclick=()=>{state.contrast=!state.contrast;applySettings();saveSettings();};
document.querySelector('.skip').onclick=event=>{event.preventDefault();find('main').focus();};
function navItem(key,title,symbol,selected,exact){
 return '<a class="navitem'+(selected?' active':'')+'" href="#/'+key+'"'+(selected?' aria-current="'+(exact?'page':'location')+'"':'')+'>'+icon(symbol)+title+'</a>';
}
function drawNav(key,task){
 find('side-nav').innerHTML='<div class="navlabel">工作台</div><div class="navlist">'+navItem('','首页','home',!key,true)+navIds.map(id=>navItem(id,modules[id].title,modules[id].icon,id===key,!task)).join('')+'</div><div class="navlist">'+navItem('access',modules.access.title,'sliders',key==='access',!task)+'</div>';
 const mobile='<a class="mobilebrand" href="#/" aria-label="回声，回到首页">'+icon('wave')+'回声</a>';
 const sep='<span aria-hidden="true">›</span>';
 find('crumb').innerHTML=mobile+(key?'<a href="#/">首页</a>'+sep+(task?'<a href="#/'+key+'">'+modules[key].title+'</a>'+sep+'<strong aria-current="page">'+modules[key].tasks[task][0]+'</strong>':'<strong aria-current="page">'+modules[key].title+'</strong>'):'<strong aria-current="page">首页</strong>');
}
const footer='<footer class="foot"><span>回声 Echo · 交互原型 · 所有演示操作均不对外提交</span><nav class="footnav" aria-label="快捷链接"><a href="#/">首页</a><a href="#/access">无障碍设置</a></nav></footer>';
const art='<div class="heroart" aria-hidden="true"><svg viewBox="0 0 510 280" preserveAspectRatio="xMaxYMid slice"><defs><linearGradient id="light" x2="1" y2="1"><stop stop-color="#f3fcf5"/><stop offset="1" stop-color="#c5e5d3"/></linearGradient></defs><circle cx="344" cy="142" r="160" fill="#d6ecdf"/><circle cx="344" cy="142" r="140" fill="none" stroke="#bddfcd"/><circle cx="344" cy="142" r="120" fill="none" stroke="#a9d7c2"/><circle cx="344" cy="142" r="92" fill="url(#light)" stroke="#b4dcca"/><circle cx="344" cy="142" r="66" fill="#f1f9f3" stroke="#a8d3bc"/><circle cx="344" cy="142" r="39" fill="#216d56"/><path d="M319 143h9l5-12 7 24 7-27 6 20 5-5h11" stroke="#e7f8ec" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M177 218C219 169 283 77 415 65c31-3 67 2 100 17" fill="none" stroke="#74aa94" stroke-width="1.6" stroke-dasharray="3 7"/><path d="M214 60c35 13 49 32 46 51M408 224c30-14 58-5 86 19" fill="none" stroke="#9acbb4"/><circle cx="228" cy="159" r="7" fill="#83bba4"/><circle cx="441" cy="67" r="7" fill="#38816a"/><circle cx="417" cy="220" r="5" fill="#38816a"/><circle cx="283" cy="254" r="4" fill="#85bda3"/><g transform="translate(216 89) rotate(-12)"><rect width="47" height="47" rx="13" fill="#f7fcf8" stroke="#b3d8c5"/><path d="M13 16h21M13 23h15M13 30h10" stroke="#468873" stroke-width="2" stroke-linecap="round"/></g><g transform="translate(432 153) rotate(10)"><rect width="50" height="50" rx="14" fill="#f7fcf8" stroke="#b3d8c5"/><path d="M25 12a8 8 0 0 0-8 8c0 6 8 13 8 13s8-7 8-13a8 8 0 0 0-8-8Z" stroke="#468873" stroke-width="1.8" fill="none"/><circle cx="25" cy="20" r="2.5" fill="#468873"/></g></svg></div>';
function homepage(){
 const tiles=navIds.map(id=>{const item=modules[id];return '<a href="#/'+id+'" class="tile"><div class="tiletop">'+glyph(item.icon,item.tone)+'<span class="arrow">'+icon('arrow')+'</span></div><h3>'+item.title+'</h3><p>'+item.desc+'</p></a>';}).join('');
 return '<section class="hero">'+art+'<div class="herotext"><span class="flowtag"><span class="dot"></span>一级页面 · 首页</span><h1 id="pagetitle" tabindex="-1">信息读得见，生活办得成</h1><p>为视障、听障与老年用户设计。识字、读字幕、找路线，一处就能开始。</p><div class="actions">'+link('read','体验读屏与识字','primary','scan')+link('caption','打开实时字幕','','captions')+'</div></div></section><section aria-labelledby="features"><div class="sectionhead"><div><h2 id="features">我想做什么？</h2><p>选择一个入口，即可进入对应的工具。</p></div><span class="count">06 项核心功能</span></div><div class="grid">'+tiles+'</div></section>';
}
function pageHeader(key,task){
 const item=modules[key];const title=task?item.tasks[task][0]:item.title;const desc=task?item.tasks[task][1]:item.desc;
 return '<a class="back" href="#/'+(task?key:'')+'">'+icon('back')+(task?'返回'+item.title:'返回首页')+'</a><section class="pagehero"><div><span class="flowtag"><span class="dot"></span>'+(task?'三级页面 · 任务操作':'二级页面 · 功能中心')+'</span><h1 id="pagetitle" tabindex="-1">'+title+'</h1><p>'+desc+'</p></div>'+glyph(task?item.tasks[task][2]:item.icon,item.tone)+'</section>';
}
function aside(key,task){
 const item=modules[key];
 return '<aside class="panel" aria-labelledby="tip-title"><div class="asidehead">'+icon('info')+'<h2 id="tip-title">体验提示</h2></div><p>'+item.tip+'</p>'+(task?'<div class="notice">首页 → '+item.title+' → '+item.tasks[task][0]+'</div>':'<div class="notice">点击工具进入三级操作页。</div>')+'</aside>';
}
function modulePage(key){
 const item=modules[key];
 return pageHeader(key)+'<div class="pagegrid"><section class="panel" aria-labelledby="tools-title"><h2 id="tools-title">选择工具</h2><div class="stack">'+Object.entries(item.tasks).map(([task,data])=>'<a class="rowlink" href="#/'+key+'/'+task+'">'+glyph(data[2],item.tone)+'<span><h3>'+data[0]+'</h3><p>'+data[1]+'</p></span><span class="arrow">'+icon('arrow')+'</span></a>').join('')+'</div></section>'+aside(key)+'</div>';
}
const status='<div class="status" id="status" role="status"></div>';
const output='<div class="output" id="result" role="region" aria-label="操作结果" tabindex="0" hidden></div>';
const displaySample='<div class="notice"><strong>样例来源：</strong>回声社区服务中心公告（内置样例）</div>';
const map='<div class="fauxmap" aria-label="演示路线：社区东门、无障碍通道、目的地"><span>社区东门</span><i class="mapline" aria-hidden="true"></i><span>无障碍通道</span><i class="mapline" aria-hidden="true"></i><span>目的地</span></div>';
function taskMarkup(task){
 switch(task){
  case 'ocr':return '<h2>识别面板</h2><p>使用内置公告，体验从图像取字到语音播报。</p>'+displaySample+'<div class="actions">'+button('recognize','识别示例文字','primary','scan')+button('read-voice','朗读结果','','play')+button('stop-voice','停止朗读')+'</div>'+output+status;
  case 'speak':return '<h2>文字与语音</h2>'+formLabel('朗读内容','<textarea id="speak-text" rows="3" maxlength="1000">你好，欢迎使用回声无障碍数字生活助手。</textarea>')+formLabel('语速：<output id="rate-label" for="rate">1.0 倍</output>','<input id="rate" type="range" min="0.6" max="1.6" step="0.1" value="1">')+'<div class="actions">'+button('read-voice','开始朗读','primary','play')+button('stop-voice','停止朗读')+'</div>'+status;
  case 'talk':case 'meeting':return '<h2>字幕窗口</h2><p>演示音源 · 不启用麦克风</p><div id="caption-box" class="output captionbox" role="log" aria-label="字幕" aria-live="polite" aria-relevant="additions">点击“开始示例”，查看逐条出现的字幕。</div><div class="actions">'+button('caption-start','开始示例','primary','play')+button('caption-stop','暂停')+button('caption-clear','清空')+'</div>'+status;
  case 'plan':return '<h2>路线偏好</h2>'+formLabel('选择目的地','<select id="destination">'+options(routePlaces)+'</select>')+'<fieldset><legend>优先经过的设施</legend><label class="check"><input id="ramp" type="checkbox" value="坡道" checked>坡道</label><label class="check"><input id="lift" type="checkbox" value="电梯">电梯</label><label class="check"><input id="tactile" type="checkbox" value="盲道">盲道</label></fieldset><div class="actions">'+button('route-plan','生成示例路线','primary','route')+'<span id="guide-link" hidden>'+link('travel/guide','查看分段导航','','arrow')+'</span></div>'+output+status;
  case 'guide':return '<h2>示例路线</h2><p id="guide-destination"></p>'+map+'<ol class="route-list" id="route-list" aria-label="路线步骤">'+routeSteps.map((step,index)=>'<li>'+String(index+1).padStart(2,'0')+' · '+step+'</li>').join('')+'</ol><div class="actions">'+button('route-back','上一步')+button('route-next','下一步','primary','arrow')+button('route-speak','朗读本段','','play')+'</div>'+status;
  case 'sos':return '<h2>确认求助信息</h2><p class="dangertext">这是一项演示，不会发送任何消息。</p><div class="notice" id="sos-summary"></div>'+formLabel('求助信息','<textarea id="sos-text" rows="3" maxlength="200">我需要协助，请在方便时与我联系。</textarea>')+'<div class="actions">'+button('sos-preview','核对求助内容','danger','shield')+'<span id="sos-confirm-wrap" hidden>'+button('sos-confirm','确认模拟发送','danger')+'</span>'+link('help/contact','调整联系人')+'</div>'+output+status;
  case 'contact':return '<h2>联系偏好</h2>'+formLabel('联系人称呼（仅演示，请勿输入号码）','<input id="contact-name" maxlength="24">')+'<label class="check"><input id="silent" type="checkbox">静默求助（演示不播放提示音）</label><div class="actions">'+button('contact-save','保存演示设置','primary')+link('help/sos','返回求助流程')+'</div>'+status;
  case 'doctor':return '<h2>模拟挂号</h2>'+formLabel('选择科室','<select id="service-first">'+options(['全科门诊','眼科门诊','耳鼻喉科'])+'</select>')+formLabel('选择时段','<select id="service-second">'+options(['示例日期 · 上午 09:30','示例日期 · 下午 14:00'])+'</select>')+'<div class="actions">'+button('service-run','生成模拟预约','primary')+'</div>'+output+status;
  case 'cab':return '<h2>模拟叫车</h2>'+formLabel('选择目的地','<select id="service-first">'+options(routePlaces)+'</select>')+formLabel('乘车需求','<select id="service-second">'+options(['需要协助上下车','携带折叠轮椅','无特殊需求'])+'</select>')+'<div class="actions">'+button('service-run','预览模拟订单','primary')+'</div>'+output+status;
  case 'office':return '<h2>示例办事清单</h2>'+formLabel('选择事项','<select id="service-first">'+options(['无障碍设施咨询','适老化改造咨询'])+'</select>')+'<div class="actions">'+button('service-run','查看示例说明','primary')+'</div>'+output+status;
  case 'shop':return '<h2>演示购物清单</h2>'+formLabel('选择用品','<select id="service-first">'+options(['大字时钟','高对比度键盘贴','防滑浴室垫'])+'</select>')+'<div class="actions">'+button('service-run','加入演示清单','primary')+'</div>'+output+status;
  case 'review':return '<h2>设施体验反馈</h2><div class="notice"><strong>社区图书馆（样例）</strong><br>东侧入口设有坡道，前台位于入口左侧。</div>'+formLabel('设施状态','<select id="service-first">'+options(['使用顺畅','需要改善','暂不可用'])+'</select>')+formLabel('补充说明（可选）','<textarea id="service-second" maxlength="200" rows="2" placeholder="请勿填写个人信息"></textarea>')+'<div class="actions">'+button('service-run','记录演示反馈','primary')+'</div>'+output+status;
  case 'volunteer':return '<h2>选择协助需求</h2>'+formLabel('协助类型','<select id="service-first">'+options(['出行陪同','窗口办事协助','数字工具使用协助'])+'</select>')+'<div class="actions">'+button('service-run','生成模拟申请','primary')+'</div>'+output+status;
  case 'mode':return '<h2>选择预设</h2><p>也可以在顶部单独切换大字与高对比。</p>'+formLabel('体验模式','<select id="mode-select">'+options(['默认模式','视障模式','听障模式','老年模式'])+'</select>')+'<div class="actions">'+button('mode-apply','应用模式','primary','sliders')+'</div>'+status;
 }
 return '';
}
function clearCaption(){if(timer!==null){clearInterval(timer);timer=null;}}
function speakText(value,rate=1){
 if(!value.trim()){setText('status','请先准备要朗读的文字。');return;}
 if(!('speechSynthesis' in window)||!('SpeechSynthesisUtterance' in window)){setText('status','当前浏览器不支持语音播放，可使用设备的读屏功能。');return;}
 speechSynthesis.cancel();
 const speech=new SpeechSynthesisUtterance(value);
 speech.lang='zh-CN';speech.rate=rate;
 const voice=speechSynthesis.getVoices().find(item=>item.lang.toLowerCase().startsWith('zh'));
 if(voice) speech.voice=voice;
 speech.onstart=()=>{if(find('status')) setText('status','正在朗读。');};
 speech.onend=()=>{if(find('status')) setText('status','朗读结束。');};
 speech.onerror=event=>{if(!['canceled','interrupted'].includes(event.error)&&find('status')) setText('status','语音不可用，请确认设备安装了语音包，或使用系统读屏。');};
 speechSynthesis.speak(speech);
}
function setupTask(task){
 const msg=value=>setText('status',value);
 const result=value=>{setText('result',value);find('result').hidden=!value;};
 const act=(id,callback)=>{find(id).onclick=callback;};
 if(task==='ocr'||task==='speak'){
  if(task==='ocr'){
   find('read-voice').disabled=true;
   act('recognize',()=>{result(readSample);find('read-voice').disabled=false;msg('已显示识别结果，可选择朗读。');});
  }else find('rate').oninput=()=>setText('rate-label',Number(find('rate').value).toFixed(1)+' 倍');
  act('read-voice',()=>task==='ocr'?speakText(readSample):speakText(find('speak-text').value,Number(find('rate').value)));
  act('stop-voice',()=>{window.speechSynthesis?.cancel();msg('已停止朗读。');});
 }
 if(task==='talk'||task==='meeting'){
  captionIndex=0;captionLines=[];
  const box=find('caption-box');
  const start=find('caption-start');const stop=find('caption-stop');stop.disabled=true;
  const reset=()=>{clearCaption();captionIndex=0;captionLines=[];box.textContent='点击“开始示例”，查看逐条出现的字幕。';start.textContent='开始示例';start.disabled=false;stop.disabled=true;};
  const nextLine=()=>{
   if(!captionLines.length) box.replaceChildren();
   const line=document.createElement('div');line.textContent=scripts[task][captionIndex++];
   captionLines.push(line.textContent);box.append(line);
   if(captionIndex>=scripts[task].length){clearCaption();start.disabled=false;start.textContent='重新播放';stop.disabled=true;msg('示例结束，共 '+captionIndex+' 条字幕。');}
  };
  act('caption-start',()=>{if(captionIndex>=scripts[task].length) reset();start.disabled=true;stop.disabled=false;msg('正在播放示例字幕。');nextLine();if(captionIndex<scripts[task].length) timer=setInterval(nextLine,2000);});
  act('caption-stop',()=>{clearCaption();start.disabled=false;start.textContent='继续播放';stop.disabled=true;msg('示例已暂停。');});
  act('caption-clear',()=>{reset();msg('字幕已清空。');});
 }
 if(task==='plan'){
  find('destination').value=state.route;
  for(const id of ['ramp','lift','tactile']) find(id).checked=state.preferences.includes(find(id).value);
  act('route-plan',()=>{
   state.route=find('destination').value;
   state.preferences=['ramp','lift','tactile'].map(find).filter(input=>input.checked).map(input=>input.value);
   result('社区东门 → '+state.route+'\n设施偏好：'+(state.preferences.join('、')||'未指定')+'\n演示路线约 650 米，仅用于展示。');
   find('guide-link').hidden=false;msg('已生成示例路线。');
  });
 }
 if(task==='guide'){
  setText('guide-destination','目的地：'+state.route);routeIndex=0;
  const draw=()=>{Array.from(find('route-list').children).forEach((item,index)=>{if(index===routeIndex)item.setAttribute('aria-current','step');else item.removeAttribute('aria-current');});find('route-back').disabled=routeIndex===0;find('route-next').disabled=routeIndex===routeSteps.length-1;};
  const update=()=>{draw();msg('第 '+(routeIndex+1)+' 步：'+routeSteps[routeIndex]);};
  draw();act('route-back',()=>{routeIndex--;update();});act('route-next',()=>{routeIndex++;update();});act('route-speak',()=>speakText(routeSteps[routeIndex]));
 }
 if(task==='sos'){
  setText('sos-summary','收件人：'+state.contact+'｜位置：社区东门（模拟）｜'+(state.silent?'静默求助':'普通求助'));
  find('sos-text').oninput=()=>{find('sos-confirm-wrap').hidden=true;result('');msg('');};
  act('sos-preview',()=>{const message=find('sos-text').value.trim();if(!message){msg('请填写求助内容。');return;}result('待确认：'+message+'\n位置信息为模拟数据。');find('sos-confirm-wrap').hidden=false;msg('请确认是否模拟发送。');});
  act('sos-confirm',()=>{find('sos-confirm-wrap').hidden=true;msg('模拟发送完成。没有联系任何人。');find('sos-preview').focus();});
 }
 if(task==='contact'){
  find('contact-name').value=state.contact;find('silent').checked=state.silent;
  act('contact-save',()=>{const name=find('contact-name').value.trim();if(!name){msg('请填写联系人称呼。');return;}state.contact=name;state.silent=find('silent').checked;msg('已保存到本次演示会话。');});
 }
 if(task==='mode'){
  find('mode-select').value=state.mode;
  act('mode-apply',()=>{
   state.mode=find('mode-select').value;state.big=state.mode==='老年模式'||state.mode==='视障模式';state.contrast=state.mode==='视障模式';applySettings();saveSettings();
   msg('已应用'+state.mode+'。'+(state.mode==='听障模式'?' 可回首页体验实时字幕。':''));
  });
 }
 if(find('service-run')) act('service-run',()=>{
  const first=find('service-first').value;const second=find('service-second')?.value.trim();
  const records={doctor:'模拟预约：'+first+'｜'+second+'\n未实际预约。',cab:'模拟订单：前往'+first+'｜'+second+'\n未实际叫车。',office:'事项：'+first+'\n1. 确认咨询主题。\n2. 记录希望解决的问题。\n3. 实际办理要求以当地服务窗口为准。',shop:'演示清单已选择：'+first+' × 1\n未支付或下单。',review:'已记录设施状态：'+first+(second?'\n说明：'+second:'')+'\n未上传。',volunteer:'模拟协助申请：'+first+'\n未联系志愿者。'};
  result(records[task]);msg('演示结果已显示。');
 });
}
function render(shouldFocus){
 if(location.hash=== '#main')return;
 const parts=location.hash.replace(/^#\/?/,'').split('/').filter(Boolean);
 const key=Object.hasOwn(modules,parts[0])?parts[0]:'';
 const task=key&&Object.hasOwn(modules[key].tasks,parts[1])?parts[1]:'';
 const path=key+'/'+task;
 if(path===currentPath)return;
 currentPath=path;clearCaption();window.speechSynthesis?.cancel();
 drawNav(key,task);
 const content=task?pageHeader(key,task)+'<div class="pagegrid"><section class="panel" aria-label="任务操作">'+taskMarkup(task)+'</section>'+aside(key,task)+'</div>':key?modulePage(key):homepage();
 find('main').innerHTML=content+footer;
 document.title=(task?modules[key].tasks[task][0]:key?modules[key].title:'无障碍数字生活助手')+' · 回声 Echo';
 if(task) setupTask(task);
 if(shouldFocus){find('pagetitle').focus({preventScroll:true});window.scrollTo(0,0);}
}
window.addEventListener('hashchange',()=>render(true));
applySettings();render(false);
</script>
